  <text x="236" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Recent SaaS Transactions</text>
  
  <rect x="236" y="395" width="480" height="20" rx="4" fill="#0b1329" opacity="0.5" />
  <text x="246" y="409" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">CloudCore Tech — Enterprise Tier</text>
  <text x="650" y="409" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">+$14,200</text>

  <rect x="236" y="420" width="480" height="20" rx="4" fill="#0b1329" opacity="0.3" />
  <text x="246" y="434" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Apex Logistics — Growth Plan</text>
  <text x="650" y="434" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">+$5,800</text>
