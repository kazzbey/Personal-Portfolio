  <!-- Sidebar -->
  <rect x="40" y="72" width="160" height="398" fill="#0b1329" />
  <rect x="60" y="95" width="120" height="24" rx="6" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1" />
  <text x="75" y="111" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⚡ Overview</text>
  
  <text x="75" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">📊 Analytics</text>
  <text x="75" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">👥 Customers</text>
  <text x="75" y="212" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">📦 Inventory</text>
  <text x="75" y="244" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">💳 Invoices</text>
  <text x="75" y="276" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">⚙️ Settings</text>

  <!-- Content Dashboard -->
  <!-- Stat Cards -->
  <g transform="translate(220, 95)">
