    <rect x="0" y="0" width="155" height="75" rx="8" fill="#131d38" stroke="rgba(255,255,255,0.06)" />
    <text x="14" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">TOTAL REVENUE</text>
    <text x="14" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">$128,450</text>
    <text x="14" y="66" fill="#22c55e" font-family="system-ui, sans-serif" font-size="9">+18.4% from last mo</text>

    <!-- Card 2 -->
    <rect x="175" y="0" width="155" height="75" rx="8" fill="#131d38" stroke="rgba(255,255,255,0.06)" />
    <text x="189" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ACTIVE LEADS</text>
    <text x="189" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">1,420</text>
    <text x="189" y="66" fill="#6366f1" font-family="system-ui, sans-serif" font-size="9">+9.2% conversion</text>

    <!-- Card 3 -->
    <rect x="350" y="0" width="165" height="75" rx="8" fill="#131d38" stroke="rgba(255,255,255,0.06)" />
    <text x="364" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">PIPELINE VALUE</text>
    <text x="364" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">$485,200</text>
    <text x="364" y="66" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9">38 enterprise deals</text>
  </g>

