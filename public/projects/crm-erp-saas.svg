<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
  </g>

  <!-- SaaS Window Frame -->
  <rect x="40" y="30" width="720" height="440" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))" />
  
  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="42" rx="12" fill="#131d36" />
  <circle cx="65" cy="51" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="82" cy="51" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="99" cy="51" r="5" fill="#22c55e" opacity="0.8" />
  <rect x="130" y="42" width="220" height="18" rx="6" fill="#1e293b" opacity="0.7" />
