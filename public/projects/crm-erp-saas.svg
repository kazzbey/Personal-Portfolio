  <rect x="220" y="190" width="330" height="150" rx="8" fill="#131d38" stroke="rgba(255,255,255,0.06)" />
  <text x="236" y="214" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Enterprise Growth Velocity</text>
  <path d="M 236 300 Q 280 280, 320 290 T 400 240 T 470 250 T 530 215" fill="none" stroke="url(#purpleGrad)" stroke-width="3" />
  <path d="M 236 300 Q 280 280, 320 290 T 400 240 T 470 250 T 530 215 L 530 325 L 236 325 Z" fill="url(#purpleGrad)" opacity="0.15" />

  <!-- Side Widget -->
  <rect x="565" y="190" width="170" height="150" rx="8" fill="#131d38" stroke="rgba(255,255,255,0.06)" />
  <text x="580" y="214" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Industry Share</text>
  <circle cx="650" cy="275" r="40" fill="none" stroke="#1e293b" stroke-width="12" />
  <circle cx="650" cy="275" r="40" fill="none" stroke="#7c3aed" stroke-width="12" stroke-dasharray="140 250" />
  <circle cx="650" cy="275" r="40" fill="none" stroke="#38bdf8" stroke-width="12" stroke-dasharray="60 250" stroke-dashoffset="-140" />

  <!-- Table Preview -->
